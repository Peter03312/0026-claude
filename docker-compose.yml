# 气瓶水套耐压试验全栈应用
#
# 常规启动：  docker compose up --build
#   前端  http://localhost:${WEB_PORT:-8080}
#   接口  http://localhost:${API_PORT:-8000}/api/health
# 一次性验收：docker compose --profile verify run --build verify
#
# 宿主端口可由环境变量覆盖，例如：WEB_PORT=9000 API_PORT=9001 docker compose up

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cylinder
      POSTGRES_PASSWORD: cylinder
      POSTGRES_DB: cylinder
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cylinder -d cylinder"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://cylinder:cylinder@db:5432/cylinder
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 一次性验收服务：跑完 pytest + vitest + playwright 后退出，不常驻。
  # 仅在显式 --profile verify（或 run verify）时启动。
  verify:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: verify/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      WEB_BASE_URL: http://web:80
      DATABASE_URL: postgresql+psycopg://cylinder:cylinder@db:5432/cylinder
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  pgdata:
